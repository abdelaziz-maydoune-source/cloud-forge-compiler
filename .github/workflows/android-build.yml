name: Cloud-Forge Android Auto-Compiler

on:
  repository_dispatch:
    types: [ai_code_trigger]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Generated AI Infrastructure
      uses: actions/checkout@v4

    - name: Set up JDK 17 (Java Environment)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android Command Line Tools & SDK
      uses: android-actions/setup-android@v3

    - name: Grant Execute Permission for Gradle Compiler
      run: chmod +x gradlew

    - name: Execute Automated Gradle Compile (Build APK)
      run: ./gradlew assembleDebug

    - name: Upload Finished Secured APK Deliverable
      uses: actions/upload-artifact@v4
      with:
        name: Generated_Android_App
        path: app/build/outputs/apk/debug/app-debug.apk
